; SatTracker-Firmware für GeekMagic SmallTV-Ultra (ESP8266 / ESP-12F)
; Flash-Layout 4M/3M FS wie die Original-Firmware, damit deren LittleFS
; (Webdateien, Fotos) erhalten bleibt und das OTA-Update passt.

[platformio]
; Unter Windows ggf. aktivieren, sonst scheitert der Build an der Pfadlänge:
; workspace_dir = C:/pio-sattracker

[env:smalltv-ultra]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    hopperpop/Sgp4@1.0.3

build_flags =
    -Os
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_SPI_MODE=SPI_MODE3
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
